<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Игровой Дроптаун</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes bounce-in {
      0% { transform: scale(0.8); opacity: 0; }
      60% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); }
    }
    .animate-bounce-in {
      animation: bounce-in 0.4s ease-out forwards;
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fade-in 0.3s ease-out forwards;
    }
    .blur-text {
      filter: blur(4px);
      user-select: none;
      pointer-events: none;
    }
    /* Стиль для кастомного dropdown */
    .dropdown-item:hover,
    .dropdown-item.active {
      background-color: #374151;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-900 via-black to-indigo-950 text-white flex items-center justify-center p-4">

        Дроптаун v 1.2
      </h1>

        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
      </button>

<div id="step1" class="relative">
  <label for="genre" class="block text-sm font-medium mb-2">Выберите жанр:</label>

    <button

      type="button"
    >
      <span id="dropdownLabel">-- Выберите жанр --</span>
      <svg id="arrowIcon" class="w-5 h-5 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </button>
    <ul id="genreDropdownList" class="absolute left-0 right-0 mt-1 bg-gray-700 border border-gray-600 rounded-lg shadow-lg max-h-60 overflow-auto hidden z-50">
      <li class="px-4 py-2 hover:bg-gray-600 cursor-pointer text-sm" data-value="Shooter">Шутеры</li>
      <li class="px-4 py-2 hover:bg-gray-600 cursor-pointer text-sm" data-value="Strategy">Стратегии</li>
      <li class="px-4 py-2 hover:bg-gray-600 cursor-pointer text-sm" data-value="Survival">Выживание</li>
      <li class="px-4 py-2 hover:bg-gray-600 cursor-pointer text-sm" data-value="Horror">Хорроры</li>
      <li class="px-4 py-2 hover:bg-gray-600 cursor-pointer text-sm" data-value="Racing">Гонки</li>
      <li class="px-4 py-2 hover:bg-gray-600 cursor-pointer text-sm" data-value="RPG">РПГ</li>
      <li class="px-4 py-2 hover:bg-gray-600 cursor-pointer text-sm" data-value="Coop">Кооператив</li>
      <li class="px-4 py-2 hover:bg-gray-600 cursor-pointer text-sm" data-value="Secret">Секретные</li>
    </ul>
    <input type="hidden" id="genre" />
  </div>
</div>

      <!-- Шаг 2: Подтверждение жанра + Крутить -->

          <h2 id="selectedGenreText" class="text-2xl font-semibold text-center mt-1 text-purple-400"></h2>
        </div>
        <div class="mb-6 h-16 flex items-center justify-center">
          <button id="spinBtn" class="px-6 py-3 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-semibold rounded-lg shadow-lg transform hover:scale-105 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-purple-400">
            Крутить
          </button>
          <div id="spinner" class="hidden flex flex-col items-center">
            <span id="spinningGame" class="animate-pulse text-lg"></span>
            <div class="mt-2 w-8 h-8 border-4 border-purple-500 border-t-transparent rounded-full animate-spin"></div>
          </div>
        </div>
      </div>

        </div>
        <button id="backToStart" class="w-full py-3 bg-gray-700 hover:bg-gray-600 text-white font-semibold rounded-lg transition-colors duration-200">
          Назад

    let isSpinning = false;
    let currentGameIndex = 0;
    let intervalId = null;
    let gamesToSpin = [];
    let isSecretMode = false;

    // Кастомный dropdown
    dropdownBtn.addEventListener('click', () => {
      const isHidden = dropdownList.classList.contains('hidden');
      dropdownList.classList.toggle('hidden', !isHidden);
      arrowIcon.classList.toggle('rotate-180', isHidden);
    });

    // Выбор жанра
    dropdownList.querySelectorAll('li').forEach(li => {
      li.addEventListener('click', () => {
        const value = li.dataset.value;
        const text = li.textContent;

        genreInput.value = value;
        dropdownLabel.textContent = text;

        dropdownList.classList.add('hidden');
        arrowIcon.classList.remove('rotate-180');

        // Переход к шагу 2
        step1.classList.add('hidden');
        selectedGenreText.textContent = text;
        step2.classList.remove('hidden');
        setTimeout(() => step2.classList.add('animate-fade-in'), 10);
        backBtn.classList.remove('hidden');
      });
    });

    // Закрытие при клике вне
    document.addEventListener('click', (e) => {
      if (!dropdownBtn.contains(e.target) && !dropdownList.contains(e.target)) {
        dropdownList.classList.add('hidden');
        arrowIcon.classList.remove('rotate-180');
      }
    });

    function resetApp() {
      isSpinning = false;
      gamesToSpin = [];
      currentGameIndex = 0;
      isSecretMode = false;
      if (intervalId) clearInterval(intervalId);
      intervalId = null;
      spinner.classList.add('hidden');
      spinBtn.classList.remove('hidden');
      step2.classList.add('hidden');
      step3.classList.add('hidden');
      backBtn.classList.add('hidden');

      // Сброс
      genreInput.value = "";
      dropdownLabel.textContent = "-- Выберите жанр --";
      step1.classList.remove('hidden');
    }

    spinBtn.addEventListener('click', () => {
      if (isSpinning) return;
      const selectedGenre = genreInput.value;
      if (!selectedGenre) return;

      gamesToSpin = genres[selectedGenre];
      currentGameIndex = 0;
      isSpinning = true;
      isSecretMode = selectedGenre === 'Secret';

      spinner.classList.remove('hidden');
      spinBtn.classList.add('hidden');
      backBtn.classList.add('hidden');
      spinningGame.textContent = gamesToSpin[currentGameIndex];
      if (isSecretMode) {
        spinningGame.classList.add('blur-text');
      }

      intervalId = setInterval(() => {
        currentGameIndex = (currentGameIndex + 1) % gamesToSpin.length;
        spinningGame.textContent = gamesToSpin[currentGameIndex];
      }, 200);

      setTimeout(() => {
        clearInterval(intervalId);
        const finalIndex = Math.floor(Math.random() * gamesToSpin.length);
        resultGameText.textContent = gamesToSpin[finalIndex];
        isSpinning = false;
        spinner.classList.add('hidden');
        step2.classList.add('hidden');
        step3.classList.remove('hidden');
        setTimeout(() => step3.classList.add('animate-bounce-in'), 10);
        backBtn.classList.remove('hidden');
        spinningGame.classList.remove('blur-text');
      }, 10000);
    });

    backBtn.addEventListener('click', resetApp);
    document.getElementById('backToStart').addEventListener('click', resetApp);
  </script>

</html>
